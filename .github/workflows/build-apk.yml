name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "::warning::debug.keystore.base64 is missing: a NEW random signing key is generated, so this APK cannot be installed over a previous build. Commit debug.keystore.base64 to keep one stable key."
            echo "Generating new debug keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p app
          cp debug.keystore app/debug.keystore 2>/dev/null || true

      - name: Ensure gradlew is executable
        run: |
          if [ -f gradlew ]; then
            sed -i 's/\r$//' gradlew || true
            chmod +x gradlew
          else
            echo "gradlew not found, generating wrapper..."
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Run unit tests (non-blocking)
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="build-${{ github.run_number }}"
          gh release create "$TAG_NAME" \
            app/build/outputs/apk/debug/*.apk \
            --title "APK Build #${{ github.run_number }}" \
            --generate-notes \
            --target "$GITHUB_SHA" || echo "Release creation skipped or failed, APK is preserved in Artifacts"
