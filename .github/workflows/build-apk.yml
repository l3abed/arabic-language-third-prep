name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Prefer a private upload key (set the KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS and
      # KEY_PASSWORD secrets). Without them the project's stable keystore is used so releases
      # remain installable over previous builds.
      - name: Setup signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signing with the private upload key from repository secrets."
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
            {
              echo "KEYSTORE_PATH=$PWD/release.keystore"
              echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD"
              echo "KEY_ALIAS=$SECRET_KEY_ALIAS"
              echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "::notice::No KEYSTORE_BASE64 secret found; signing with the project's stable keystore."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Ensure gradlew is executable
        run: |
          if [ -f gradlew ]; then
            sed -i 's/\r$//' gradlew || true
            chmod +x gradlew
          else
            echo "gradlew not found, generating wrapper..."
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK for a stable download link
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/arabic-language-third-prep.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arabic-language-third-prep-apk
          path: dist/arabic-language-third-prep.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="build-${{ github.run_number }}"
          gh release create "$TAG_NAME" \
            dist/arabic-language-third-prep.apk \
            --title "APK Build #${{ github.run_number }}" \
            --generate-notes \
            --target "$GITHUB_SHA"
